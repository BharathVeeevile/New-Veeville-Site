<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Width Videos with Navbar</title>
    <link rel="stylesheet" href="separate.css">
</head>

<body>

    <nav id="navbar">
        <div class="nav-links">
            <a href="#digital">Veeville</a>
            <a href="#belief">About</a>
            <a href="#work">WORK</a>
        </div>
        <img class="logo" src="https://veeville.com/wp-content/uploads/2023/05/VeevilleLogo.png" alt="Logo">
        <div class="search">SEARCH</div>
    </nav>


    <!-- Video Sections -->
<section class="video-section">
    <div class="video-container">
      <iframe src="https://player.vimeo.com/video/927938424?h=c445572028&autoplay=1&muted=1&loop=1&background=1"></iframe>
    </div>
  </section>
  
  <section class="video-section">
    <div class="video-container">
      <iframe src="https://player.vimeo.com/video/991613826?h=422f7fd875&autoplay=1&muted=1&loop=1&background=1"></iframe>
    </div>
  </section>
  
  <section class="video-section">
    <div class="video-container">
      <iframe src="https://player.vimeo.com/video/1023014366?h=20a1eef77c&autoplay=1&muted=1&loop=1&background=1"></iframe>
    </div>
  </section>
  
  <section class="video-section">
    <div class="video-container">
      <iframe src="https://player.vimeo.com/video/783595880?h=64abe5e0e8&autoplay=1&muted=1&loop=1&background=1"></iframe>
    </div>
  </section>
  
  <section class="video-section">
    <div class="video-container">
      <iframe src="https://www.youtube.com/embed/t1wCpaR_4Po?autoplay=1&mute=1&loop=1&playlist=t1wCpaR_4Po&controls=0&modestbranding=1"></iframe>
    </div>
  </section>
  
  

    <!-- Scroll to Top Button -->
    <div class="newsletter-container">
        <div class="newsletter-box">NEWSLETTER</div>
        <div class="newsletter-btn">
            <span class="plus">+</span>
        </div>
    </div>
    <script>
        // Video Autoplay Setup
        function enableVideoAutoplay() {
            const iframes = document.querySelectorAll('.video-section iframe');
            iframes.forEach(iframe => {
                iframe.setAttribute('allow', 'autoplay; fullscreen');
            });
        }

        // Navbar background change on scroll
        function setupNavbarOnScroll() {
            const navbar = document.getElementById('navbar');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            });
        }

        // Initialize Functions
        document.addEventListener("DOMContentLoaded", () => {
            enableVideoAutoplay();
            setupNavbarOnScroll();
        });

    </script>

    <script>
        // Scroll to Top Button Initialization
        // Scroll-to-top functionality (optional)
        // You can remove this if only hover functionality is needed
        function initNewsletterButton() {
            const btn = document.querySelector('.newsletter-btn');
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        document.addEventListener('DOMContentLoaded', initNewsletterButton);

    </script>
</body>

</html>
