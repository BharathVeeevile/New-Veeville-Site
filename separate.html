  <!-- JS CODE -->

  <script>
    // Fixed solution for sequential section scrolling with touchpad
    document.addEventListener('DOMContentLoaded', function () {
      // Modal functionality
      document.querySelector('#openModal')?.addEventListener('click', function () {
        document.querySelector('#formModal').style.display = 'flex';
      });

      document.querySelector('#closeModal')?.addEventListener('click', function () {
        document.querySelector('#formModal').style.display = 'none';
      });

      // Track scrolling state and sections
      let scrolling = false;
      let touchStartY = 0;
      let touchEndY = 0;
      const sections = document.querySelectorAll('.video-section, .footer-section');
      const dots = document.querySelectorAll('.dot');
      const navLinks = document.querySelectorAll('.nav-links a');
      let currentSection = 0;
      let scrollTimeout;
      const scrollContainer = document.querySelector('.scroll-container');

      // Track last scroll time to prevent rapid consecutive scrolls
      let lastScrollTime = 0;
      // Minimum time between scrolls (in milliseconds)
      const scrollCooldown = 800;

      // Initialize - set first section active
      function initializeActiveStates() {
        // Set initial active states
        if (dots.length > 0) dots[0].classList.add('active');
        if (navLinks.length > 1) navLinks[1].classList.add('active'); // ABOUT is active by default
      }

      // Update active states based on current section
      function updateActiveStates(sectionIndex) {
        // Update active dot
        dots.forEach(dot => dot.classList.remove('active'));
        const activeDot = document.querySelector(`.dot[data-target="${sectionIndex}"]`);
        if (activeDot) activeDot.classList.add('active');

        // Update active nav link
        navLinks.forEach(link => link.classList.remove('active'));
        if (sectionIndex === 0) {
          navLinks[1]?.classList.add('active'); // ABOUT
        } else if (sectionIndex === 1) {
          navLinks[2]?.classList.add('active'); // WORK
        } else if (sectionIndex === 2) {
          navLinks[3]?.classList.add('active'); // CLIENTS
        }
      }

      // Navigate to a specific section - SEQUENTIAL APPROACH
      function navigateToSection(sectionIndex) {
        if (scrolling) return;

        // Get current time
        const now = Date.now();

        // Check if enough time has passed since last scroll
        if (now - lastScrollTime < scrollCooldown) {
          return;
        }

        // Update last scroll time
        lastScrollTime = now;

        // Ensure section index is within bounds
        sectionIndex = Math.min(Math.max(sectionIndex, 0), sections.length - 1);

        // Ensure we only move one section at a time
        if (sectionIndex > currentSection) {
          sectionIndex = currentSection + 1;
        } else if (sectionIndex < currentSection) {
          sectionIndex = currentSection - 1;
        }

        // Set scrolling lock
        scrolling = true;
        currentSection = sectionIndex;

        // Scroll to the section
        sections[sectionIndex].scrollIntoView({ behavior: 'smooth', block: 'start' });

        // Update active states
        updateActiveStates(sectionIndex);

        // Release scrolling lock after animation completes
        scrollTimeout = setTimeout(() => {
          scrolling = false;
        }, 600); // Longer timeout to prevent rapid scrolling
      }

      // Set up intersection observer
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting && !scrolling) {
            const sectionId = entry.target.id;
            if (sectionId) {
              const sectionIndex = parseInt(sectionId.split('-')[1]);
              currentSection = sectionIndex;
              updateActiveStates(sectionIndex);
            }
          }
        });
      }, { threshold: 0.5 });

      // Observe all sections
      sections.forEach(section => {
        observer.observe(section);
      });

      // Accumulated delta for touchpad scrolling
      let accumulatedDelta = 0;
      const deltaThreshold = 50; // Threshold before triggering section change

      // Improved wheel event handler for touchpad
      function handleWheel(e) {
        // Prevent default scrolling behavior
        e.preventDefault();

        // If already scrolling or cooldown not complete, ignore
        if (scrolling || (Date.now() - lastScrollTime < scrollCooldown)) {
          return;
        }

        // Accumulate delta (for touchpad support)
        accumulatedDelta += e.deltaY;

        // Only trigger scroll after threshold is reached
        if (Math.abs(accumulatedDelta) >= deltaThreshold) {
          // Determine scroll direction
          const direction = accumulatedDelta > 0 ? 1 : -1;

          // Reset accumulated delta
          accumulatedDelta = 0;

          // Navigate to adjacent section only
          navigateToSection(currentSection + direction);
        }
      }

      // Add wheel event listener
      window.addEventListener('wheel', function (e) {
        e.preventDefault();
        handleWheel(e);
      }, { passive: false });

      // Touch events for mobile support
      document.addEventListener('touchstart', function (e) {
        touchStartY = e.touches[0].clientY;
      });

      document.addEventListener('touchmove', function (e) {
        if (scrolling) {
          e.preventDefault();
          return;
        }
        touchEndY = e.touches[0].clientY;
      }, { passive: false });

      document.addEventListener('touchend', function () {
        if (scrolling || (Date.now() - lastScrollTime < scrollCooldown)) return;

        const touchDiff = touchStartY - touchEndY;

        // Only respond to significant swipes
        if (Math.abs(touchDiff) > 50) {
          const direction = touchDiff > 0 ? 1 : -1;
          // Navigate to adjacent section only
          navigateToSection(currentSection + direction);
        }
      });

      // Keyboard navigation
      document.addEventListener('keydown', function (e) {
        if (scrolling || (Date.now() - lastScrollTime < scrollCooldown)) return;

        // Arrow up/down or Page up/down keys
        if (e.key === 'ArrowDown' || e.key === 'PageDown') {
          e.preventDefault();
          navigateToSection(currentSection + 1);
        } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
          e.preventDefault();
          navigateToSection(currentSection - 1);
        }
      });

      // Handle dot clicks
      dots.forEach(dot => {
        dot.addEventListener('click', function () {
          if (scrolling) return;

          const targetIndex = parseInt(this.getAttribute('data-target'));

          // For dot navigation, allow direct jumps to any section
          // (override the sequential constraint)
          scrolling = true;
          currentSection = targetIndex;

          sections[targetIndex].scrollIntoView({ behavior: 'smooth', block: 'start' });
          updateActiveStates(targetIndex);

          lastScrollTime = Date.now();

          scrollTimeout = setTimeout(() => {
            scrolling = false;
          }, 600);
        });
      });

      // Handle nav links
      navLinks.forEach((link, index) => {
        if (index > 0 && index <= 3) { // Skip logo, handle ABOUT, WORK, CLIENTS
          link.addEventListener('click', function (e) {
            e.preventDefault();
            if (scrolling) return;

            const targetSection = index - 1; // Adjust for index offset

            // For nav links, allow direct jumps to any section
            // (override the sequential constraint)
            scrolling = true;
            currentSection = targetSection;

            sections[targetSection].scrollIntoView({ behavior: 'smooth', block: 'start' });
            updateActiveStates(targetSection);

            lastScrollTime = Date.now();

            scrollTimeout = setTimeout(() => {
              scrolling = false;
            }, 600);
          });
        }
      });

      // Prevent default scrolling on the container
      scrollContainer?.addEventListener('scroll', function (e) {
        if (scrolling) {
          e.preventDefault();
        }
      }, { passive: false });

      // Initialize the page
      initializeActiveStates();
    });
  </script>



  <script>
    // Replace your existing navigation highlighting code with this
    document.addEventListener("DOMContentLoaded", () => {
      // Get all sections and navigation links
      const sections = document.querySelectorAll("section")
      const desktopNavLinks = document.querySelectorAll(".desktop-links a")
      const mobileNavLinks = document.querySelectorAll(".fullscreen-nav a")

      // Mobile menu functionality
      const menuToggle = document.querySelector(".menu-toggle")
      const fullscreenNav = document.querySelector(".fullscreen-nav")
      const closeBtn = document.querySelector(".close-btn")
      const searchDesktop = document.querySelector(".search")

      if (menuToggle && fullscreenNav && closeBtn && searchDesktop) {
        menuToggle.addEventListener("click", () => {
          fullscreenNav.classList.add("active")
          fullscreenNav.style.display = "flex"
          menuToggle.style.visibility = "hidden"
          searchDesktop.style.visibility = "hidden"
        })

        closeBtn.addEventListener("click", () => {
          fullscreenNav.classList.remove("active")
          fullscreenNav.style.display = "none"
          menuToggle.style.visibility = "visible"
          searchDesktop.style.visibility = "visible"
        })
      }

      // Function to set active navigation link
      function setActiveNav(sectionId) {
        // Remove active class from all links
        desktopNavLinks.forEach((link) => link.classList.remove("active"))
        mobileNavLinks.forEach((link) => link.classList.remove("active"))

        // Add active class to links that match the current section
        const currentSectionLinks = document.querySelectorAll(`a[href="#${sectionId}"]`)
        currentSectionLinks.forEach((link) => link.classList.add("active"))
      }

      // Create Intersection Observer to detect active section
      const observerOptions = {
        root: null, // Use viewport as root
        rootMargin: "-40% 0px -40% 0px", // Adjust this to control when the section is considered "active"
        threshold: 0.1, // Trigger when at least 10% of the target is visible
      }

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          // When section enters viewport
          if (entry.isIntersecting) {
            const sectionId = entry.target.getAttribute("id")
            setActiveNav(sectionId)
          }
        })
      }, observerOptions)

      // Observe all sections
      sections.forEach((section) => {
        observer.observe(section)
      })

      // Set initial active section based on current position
      function setInitialActive() {
        // Get current scroll position
        const scrollPosition = window.scrollY + window.innerHeight / 3

        // Find the section that's currently in view
        for (let i = 0; i < sections.length; i++) {
          const section = sections[i]
          const sectionTop = section.offsetTop
          const sectionHeight = section.offsetHeight

          if (scrollPosition >= sectionTop && scrollPosition < sectionTop + sectionHeight) {
            setActiveNav(section.getAttribute("id"))
            break
          }
        }
      }

      // Set initial active section on page load
      setInitialActive()

      // Handle navigation link clicks
      function handleNavClick(e) {
        e.preventDefault()
        const targetId = this.getAttribute("href").substring(1)
        const targetSection = document.getElementById(targetId)

        if (targetSection) {
          targetSection.scrollIntoView({ behavior: "smooth" })
          setActiveNav(targetId)

          // Close mobile menu if open
          if (fullscreenNav && fullscreenNav.classList.contains("active")) {
            fullscreenNav.classList.remove("active")
            fullscreenNav.style.display = "none"
            if (menuToggle) menuToggle.style.visibility = "visible"
            if (searchDesktop) searchDesktop.style.visibility = "visible"
          }
        }
      }

      // Add click event listeners to navigation links
      desktopNavLinks.forEach((link) => {
        link.addEventListener("click", handleNavClick)
      })

      mobileNavLinks.forEach((link) => {
        link.addEventListener("click", handleNavClick)
      })
    })

  </script>
