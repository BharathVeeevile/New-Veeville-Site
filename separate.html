<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Width Videos with Navbar</title>
    <link rel="stylesheet" href="separate.css">
</head>

<body>

    <nav id="navbar">
        <div class="nav-links">
            <img class="logo" src="../Images/Work Page Thumbnails/Logo Image.webp" alt="Logo">
         
            <a href="#belief">About</a>
            <a href="#work">WORK</a>
        </div>
     
        <div class="search">SEARCH</div>
    </nav>


    <!-- Video Sections -->
    <section class="video-section">
        <div class="video-container">
            <iframe
                src="https://player.vimeo.com/video/927938424?h=c445572028&autoplay=1&muted=1&loop=1&background=1"></iframe>
        </div>
    </section>

    <section class="video-section">
        <div class="video-container">
            <iframe
                src="https://player.vimeo.com/video/991613826?h=422f7fd875&autoplay=1&muted=1&loop=1&background=1"></iframe>
        </div>
    </section>

    <section class="video-section">
        <div class="video-container">
            <iframe
                src="https://player.vimeo.com/video/1023014366?h=20a1eef77c&autoplay=1&muted=1&loop=1&background=1"></iframe>
        </div>
    </section>

    <section class="video-section">
        <div class="video-container">
            <iframe
                src="https://player.vimeo.com/video/783595880?h=64abe5e0e8&autoplay=1&muted=1&loop=1&background=1"></iframe>
        </div>
    </section>

    <section class="video-section">
        <div class="video-container">
            <iframe
                src="https://www.youtube.com/embed/t1wCpaR_4Po?autoplay=1&mute=1&loop=1&playlist=t1wCpaR_4Po&controls=0&modestbranding=1"></iframe>
        </div>
    </section>



    <!-- Scroll to Top Button -->

    <!-- Button at Bottom Right -->
    <div class="newsletter-btn" id="openModal">
        <span class="plus">+</span>
    </div>

    <!-- Modal Popup -->
    <div id="formModal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="closeModal">&times;</span>
            <h2>General Inquiries</h2>
            <p>For general support and customer inquiries, please fill out the form below, and our team will get back to
                you shortly.</p>

            <form id="contactForm">
                <label>Your Name <span>*</span></label>
                <input type="text" id="name" required>

                <label>Your Email <span>*</span></label>
                <input type="email" id="email" required>

                <label>Purpose <span>*</span></label>
                <select id="purpose" required>
                    <option value="" disabled selected>Select a Purpose</option>
                    <option value="Support">Support</option>
                    <option value="Feedback">Feedback</option>
                    <option value="General Inquiry">General Inquiry</option>
                </select>

                <label>Your Message <span>*</span></label>
                <textarea id="message" rows="4" required></textarea>

                <button type="submit" class="submit-btn">Send Inquiry</button>
            </form>
        </div>
    </div>


    <script>
        // Video Autoplay Setup
        function enableVideoAutoplay() {
            const iframes = document.querySelectorAll('.video-section iframe');
            iframes.forEach(iframe => {
                iframe.setAttribute('allow', 'autoplay; fullscreen');
            });
        }

        // Navbar background change on scroll
        function setupNavbarOnScroll() {
            const navbar = document.getElementById('navbar');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            });
        }

        // Initialize Functions
        document.addEventListener("DOMContentLoaded", () => {
            enableVideoAutoplay();
            setupNavbarOnScroll();
        });

    </script>

    <script>
        // Scroll to Top Button Initialization
        // Scroll-to-top functionality (optional)
        // You can remove this if only hover functionality is needed
        function initNewsletterButton() {
            const btn = document.querySelector('.newsletter-btn');
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        document.addEventListener('DOMContentLoaded', initNewsletterButton);

    </script>

    <script>
        // Initialize Modal functionality
        function initModal() {
            const modal = document.getElementById("formModal");
            const openBtn = document.getElementById("openModal");
            const closeBtn = document.getElementById("closeModal");
            const form = document.getElementById("contactForm");

            // Open modal
            openBtn.onclick = () => modal.style.display = "block";

            // Close modal
            closeBtn.onclick = () => modal.style.display = "none";

            // Close modal when clicking outside modal content
            window.onclick = (event) => {
                if (event.target == modal) {
                    modal.style.display = "none";
                }
            };

            // Form Submission to Email
            form.addEventListener('submit', function (e) {
                e.preventDefault();

                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const purpose = document.getElementById('purpose').value;
                const message = document.getElementById('message').value;

                const emailBody = `Name: ${name}%0D%0AEmail: ${email}%0D%0APurpose: ${purpose}%0D%0AMessage: ${message}`;

                window.location.href = `mailto:youremail@example.com?subject=New Inquiry from ${name}&body=${emailBody}`;

                modal.style.display = "none";
                form.reset();
            });
        }

        // Initialize after DOM load
        document.addEventListener('DOMContentLoaded', initModal);

    </script>
</body>

</html>
