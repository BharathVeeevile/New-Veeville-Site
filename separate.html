<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fullscreen Scroll Video</title>
    <link rel="stylesheet" href="separate.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>

    <!-- NAVIGATION -->
    <nav id="navbar">
        <div class="nav-links">
            <a href="#section-0">
                <img class="logo" src="../Images/Work Page Thumbnails/Logo Image.webp" alt="Logo" />
            </a>
            <a href="#section-0">ABOUT</a>
            <a href="#section-1">WORK</a>
            <a href="#section-2">CLIENTS</a>
        </div>
        <div class="search">SEARCH</div>
    </nav>

    <!-- DOT SIDEBAR -->
    <div class="dot-sidebar">
        <div class="dot" data-target="0"></div>
        <div class="dot" data-target="1"></div>
        <div class="dot" data-target="2"></div>
        <div class="dot" data-target="3"></div>
        <div class="dot" data-target="4"></div>
    </div>

    <!-- FULLSCREEN SCROLL CONTAINER -->
    <main class="scroll-container">

        <section id="section-0" class="video-section">
            <div class="video-wrapper">
              <div class="video-embed">
                <iframe
                  src="https://player.vimeo.com/video/1073901024?h=82db25f217&autoplay=1&loop=1&muted=1&background=1"
                  frameborder="0"
                  allow="autoplay; fullscreen"
                  allowfullscreen>
                </iframe>
              </div>
            </div>
          </section>
          
          
          
          <!-- Vimeo Player JS (optional for interactivity) -->
        
          
          
          
          <section id="section-1" class="video-section">
            <div class="video-wrapper">
              <div class="video-embed">
                <iframe
                  src="https://player.vimeo.com/video/912497902?h=560bea0895&autoplay=1&loop=1&muted=1&background=1"
                  frameborder="0"
                  allow="autoplay; fullscreen"
                  allowfullscreen>
                </iframe>
              </div>
            </div>
          </section>
          
          <section id="section-2" class="video-section">
            <div class="video-wrapper">
              <div class="video-embed">
                <iframe
                  src="https://player.vimeo.com/video/991613826?h=422f7fd875&autoplay=1&loop=1&muted=1&background=1"
                  frameborder="0"
                  allow="autoplay; fullscreen"
                  allowfullscreen>
                </iframe>
              </div>
            </div>
          </section>
          
          <section id="section-4" class="video-section">
            <div class="video-wrapper">
              <div class="video-embed">
                <iframe
                  src="https://www.youtube.com/embed/t1wCpaR_4Po?autoplay=1&mute=1&loop=1&playlist=t1wCpaR_4Po&controls=0&modestbranding=1&rel=0"
                  frameborder="0"
                  allow="autoplay; fullscreen"
                  allowfullscreen>
                </iframe>
              </div>
            </div>
          </section>
          
          

  


        <section id="section-5" class="footer-section">
            <div class="columns-row">
                <div class="column">
                    <h3>Contact</h3>
                    <p>Let's chat.</p>
                </div>
                <div class="column">
                    <h3>Newsletter</h3>
                    <p>Subscribe.</p>
                </div>
                <div class="column">
                    <h3>Join us</h3>
                    <p>Careers.</p>
                </div>
                <div class="spacer-column"></div>
            </div>
            <div class="info-row">
                <div class="locations"><span>London.</span><span>New York.</span></div>
            </div>
            <div class="footer-bottom">
                <p>© Pearfisher 1992 - 2024 <a href="#">Privacy Policy</a> <a href="#">Sitemap</a></p>
                <div class="social-icons">
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="#"><i class="fab fa-linkedin-in"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-youtube"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                </div>
            </div>
        </section>

    </main>

    <!-- Floating Modal Button -->
    <div class="newsletter-btn" id="openModal">
        <span class="plus">+</span>
    </div>

    <!-- Contact Modal -->
    <div id="formModal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="closeModal">&times;</span>
            <h2>General Inquiries</h2>
            <form id="contactForm">
                <label>Your Name <span>*</span></label>
                <input type="text" id="name" required />
                <label>Your Email <span>*</span></label>
                <input type="email" id="email" required />
                <label>Purpose <span>*</span></label>
                <select id="purpose" required>
                    <option disabled selected>Select a Purpose</option>
                    <option value="Support">Support</option>
                    <option value="Feedback">Feedback</option>
                    <option value="General Inquiry">General Inquiry</option>
                </select>
                <label>Your Message <span>*</span></label>
                <textarea id="message" rows="4" required></textarea>
                <button type="submit" class="submit-btn">Send Inquiry</button>
            </form>
        </div>
    </div>



    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const sections = document.querySelectorAll(".video-section, .footer-section");
            const dots = document.querySelectorAll(".dot");
            const navLinks = document.querySelectorAll(".nav-links a");

            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const index = Array.from(sections).indexOf(entry.target);
                        dots.forEach(dot => dot.classList.remove("active"));
                        if (dots[index]) dots[index].classList.add("active");

                        navLinks.forEach(link => link.classList.remove("active"));
                        if (navLinks[index]) navLinks[index].classList.add("active");
                    }
                });
            }, { threshold: 0.6 });

            sections.forEach(section => observer.observe(section));

            dots.forEach(dot => {
                dot.addEventListener("click", () => {
                    const index = parseInt(dot.getAttribute("data-target"));
                    sections[index].scrollIntoView({ behavior: "smooth" });
                });
            });

            navLinks.forEach((link, index) => {
                link.addEventListener("click", (e) => {
                    e.preventDefault();
                    sections[index].scrollIntoView({ behavior: "smooth" });
                });
            });

            const modal = document.getElementById("formModal");
            const openBtn = document.getElementById("openModal");
            const closeBtn = document.getElementById("closeModal");

            openBtn.onclick = () => modal.style.display = "block";
            closeBtn.onclick = () => modal.style.display = "none";
            window.onclick = e => { if (e.target == modal) modal.style.display = "none"; };
        });

    </script>
</body>

</html>
