<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fullscreen Scroll Video</title>
  <link rel="stylesheet" href="separate.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>

  <!-- NAVIGATION -->
  <nav id="navbar">
    <div class="nav-links">
      <a href="#section-0">
        <img class="logo" src="../Images/Work Page Thumbnails/Logo Image.webp" alt="Logo" />
      </a>
      <a href="#section-0">ABOUT</a>
      <a href="#section-1">WORK</a>
      <a href="#section-2">CLIENTS</a>
    </div>
    <div class="search">SEARCH</div>
  </nav>

  <!-- DOT SIDEBAR -->
  <div class="dot-sidebar">
    <div class="dot" data-target="0"></div>
    <div class="dot" data-target="1"></div>
    <div class="dot" data-target="2"></div>
    <div class="dot" data-target="3"></div>
    <div class="dot" data-target="4"></div>
  </div>

  <!-- FULLSCREEN SCROLL CONTAINER -->
  <main class="scroll-container">

    <section id="section-0" class="video-section">
      <div class="video-wrapper">
        <div class="video-embed">
          <iframe src="https://player.vimeo.com/video/1073901024?h=82db25f217&autoplay=1&loop=1&muted=1&background=1"
            frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
      </div>
    </section>

    <section id="section-1" class="video-section">
      <div class="video-wrapper">
        <div class="video-embed">
          <iframe src="https://player.vimeo.com/video/912497902?h=560bea0895&autoplay=1&loop=1&muted=1&background=1"
            frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
      </div>
    </section>

    <section id="section-2" class="video-section">
      <div class="video-wrapper">
        <div class="video-embed">
          <iframe src="https://player.vimeo.com/video/991613826?h=422f7fd875&autoplay=1&loop=1&muted=1&background=1"
            frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
      </div>
    </section>

    <section id="section-3" class="video-section">
      <div class="video-wrapper">
        <div class="video-embed">
          <iframe
            src="https://www.youtube.com/embed/t1wCpaR_4Po?autoplay=1&mute=1&loop=1&playlist=t1wCpaR_4Po&controls=0&modestbranding=1&rel=0"
            frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
      </div>
    </section>

    <section id="section-4" class="footer-section">
      <div class="columns-row">
        <div class="column">
          <h3>Contact</h3>
          <p>Let's chat.</p>
        </div>
        <div class="column">
          <h3>Newsletter</h3>
          <p>Subscribe.</p>
        </div>
        <div class="column">
          <h3>Join us</h3>
          <p>Careers.</p>
        </div>
        <div class="spacer-column"></div>
      </div>
      <div class="info-row">
        <div class="locations"><span>London.</span><span>New York.</span></div>
      </div>
      <div class="footer-bottom">
        <p>Veeville 2009 - 2025 <a href="#">Privacy Policy</a> <a href="#">Sitemap</a></p>
        <div class="social-icons">
          <a href="#"><i class="fab fa-facebook-f"></i></a>
          <a href="#"><i class="fab fa-linkedin-in"></i></a>
          <a href="#"><i class="fab fa-instagram"></i></a>
          <a href="#"><i class="fab fa-youtube"></i></a>
          <a href="#"><i class="fab fa-twitter"></i></a>
        </div>
      </div>
    </section>

  </main>

  <!-- Floating Modal Button -->
  <div class="newsletter-btn" id="openModal">
    <span class="plus">+</span>
  </div>

  <!-- Contact Modal (unchanged) -->
  <div id="formModal" class="modal">
    <div class="modal-content">
      <span class="close-button" id="closeModal">&times;</span>
      <h2>General Inquiries</h2>
      <form id="contactForm">
        <label>Your Name <span>*</span></label>
        <input type="text" id="name" required />
        <label>Your Email <span>*</span></label>
        <input type="email" id="email" required />
        <label>Subject <span>*</span></label>
        <input type="text" id="text" required />
        <label>Your Message <span>*</span></label>
        <textarea id="message" rows="4" required></textarea>
        <button type="submit" class="submit-btn">Send Inquiry</button>
      </form>
    </div>
  </div>

  <!-- JS CODE -->
  <script>
    // Modal functionality
    document.querySelector('#openModal').onclick = function () {
      document.querySelector('#formModal').style.display = 'flex';
    };

    document.querySelector('#closeModal').onclick = function () {
      document.querySelector('#formModal').style.display = 'none';
    };

    // Track scrolling state and sections
    let scrolling = false;
    const sections = document.querySelectorAll('.video-section, .footer-section');
    const dots = document.querySelectorAll('.dot');
    const navLinks = document.querySelectorAll('.nav-links a');
    let currentSection = 0;

    // Set initial active states
    dots[0].classList.add('active');
    navLinks[1].classList.add('active'); // ABOUT is active by default

    // Intersection Observer to detect which section is in view
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !scrolling) {
          const sectionId = entry.target.id;
          const sectionIndex = parseInt(sectionId.split('-')[1]);

          // Update current section
          currentSection = sectionIndex;

          // Update active dot
          dots.forEach(dot => dot.classList.remove('active'));
          const activeDot = document.querySelector(`.dot[data-target="${sectionIndex}"]`);
          if (activeDot) activeDot.classList.add('active');

          // Update active nav link
          navLinks.forEach(link => link.classList.remove('active'));
          if (sectionIndex === 0) {
            navLinks[1].classList.add('active'); // ABOUT
          } else if (sectionIndex === 1) {
            navLinks[2].classList.add('active'); // WORK
          } else if (sectionIndex === 2) {
            navLinks[3].classList.add('active'); // CLIENTS
          }
        }
      });
    }, { threshold: 0.7 }); // Trigger when 70% of the section is visible

    // Observe all sections
    sections.forEach(section => {
      observer.observe(section);
    });

    // Handle wheel event for smooth scrolling
    window.addEventListener('wheel', function (e) {
      e.preventDefault();
      if (scrolling) return;

      scrolling = true;

      let newSection = currentSection + (e.deltaY > 0 ? 1 : -1);
      newSection = Math.min(Math.max(newSection, 0), sections.length - 1);

      currentSection = newSection;
      sections[newSection].scrollIntoView({ behavior: 'smooth' });

      // Update active dot
      dots.forEach(dot => dot.classList.remove('active'));
      dots[newSection].classList.add('active');

      // Update active nav link
      navLinks.forEach(link => link.classList.remove('active'));
      if (newSection === 0) {
        navLinks[1].classList.add('active'); // ABOUT
      } else if (newSection === 1) {
        navLinks[2].classList.add('active'); // WORK
      } else if (newSection === 2) {
        navLinks[3].classList.add('active'); // CLIENTS
      }

      setTimeout(() => scrolling = false, 1000);
    }, { passive: false });

    // Handle dot clicks
    dots.forEach(dot => {
      dot.addEventListener('click', function () {
        if (scrolling) return;

        scrolling = true;
        const targetIndex = parseInt(this.getAttribute('data-target'));
        currentSection = targetIndex;

        sections[targetIndex].scrollIntoView({ behavior: 'smooth' });

        // Update active dot
        dots.forEach(d => d.classList.remove('active'));
        this.classList.add('active');

        // Update active nav link
        navLinks.forEach(link => link.classList.remove('active'));
        if (targetIndex === 0) {
          navLinks[1].classList.add('active'); // ABOUT
        } else if (targetIndex === 1) {
          navLinks[2].classList.add('active'); // WORK
        } else if (targetIndex === 2) {
          navLinks[3].classList.add('active'); // CLIENTS
        }

        setTimeout(() => scrolling = false, 1000);
      });
    });

    // Handle nav links
    navLinks.forEach((link, index) => {
      if (index > 0 && index <= 3) { // Skip logo, handle ABOUT, WORK, CLIENTS
        link.addEventListener('click', function (e) {
          e.preventDefault();
          if (scrolling) return;

          scrolling = true;
          const targetSection = index - 1; // Adjust for index offset
          currentSection = targetSection;

          sections[targetSection].scrollIntoView({ behavior: 'smooth' });

          // Update active dot
          dots.forEach(d => d.classList.remove('active'));
          dots[targetSection].classList.add('active');

          // Update active nav link
          navLinks.forEach(l => l.classList.remove('active'));
          this.classList.add('active');

          setTimeout(() => scrolling = false, 1000);
        });
      }
    });
  </script>
</body>

</html>
