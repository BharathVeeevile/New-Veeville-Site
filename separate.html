  <!-- JS CODE scrooling nvagation and dots-->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Core elements
      const sectionContainer = document.querySelector(".section-container")
      const sections = document.querySelectorAll(".video-section, .footer-section")
      const dots = document.querySelectorAll(".dot")
      const navLinks = document.querySelectorAll(".nav-links a")

      // State variables
      let currentSectionIndex = 0
      let isScrolling = false
      let isScrollLocked = false
      let scrollTimeout = null

      // Animation settings
      const scrollDuration = 800 // ms - longer duration to ensure smooth transitions
      const scrollLockTime = 800 // ms - time to lock scroll after a scroll action

      // Initialize active states
      function initializeActiveStates() {
        if (dots.length > 0) dots[0].classList.add("active")
        if (navLinks.length > 1) navLinks[1].classList.add("active")
      }

      // Update active states
      function updateActiveStates(sectionIndex) {
        // Update dots
        dots.forEach((dot) => dot.classList.remove("active"))
        const activeDot = document.querySelector(`.dot[data-target="${sectionIndex}"]`)
        if (activeDot) activeDot.classList.add("active")

        // Update nav links
        navLinks.forEach((link) => link.classList.remove("active"))
        if (sectionIndex === 0) {
          navLinks[1]?.classList.add("active")
        } else if (sectionIndex === 1) {
          navLinks[2]?.classList.add("active")
        } else if (sectionIndex === 2) {
          navLinks[3]?.classList.add("active")
        }
      }

      // Completely disable native scrolling
      function disableNativeScroll() {
        document.body.style.overflow = 'hidden'
        sectionContainer.style.overflow = 'hidden'
      }

      // Scroll to section with controlled animation
      function scrollToSection(index) {
        if (isScrolling || index < 0 || index >= sections.length) return false

        isScrolling = true
        isScrollLocked = true

        // Clear any existing timeout
        if (scrollTimeout) {
          clearTimeout(scrollTimeout)
        }

        // Update current index
        currentSectionIndex = index

        // Update UI
        updateActiveStates(index)

        // Scroll to section with smooth behavior
        sections[index].scrollIntoView({ behavior: "smooth" })

        // Set timeout to release scrolling lock
        scrollTimeout = setTimeout(() => {
          isScrolling = false

          // Add a small delay before allowing another scroll
          setTimeout(() => {
            isScrollLocked = false
          }, 50)
        }, scrollDuration)

        return true
      }

      // Handle scroll direction with strict sequential movement
      function handleScroll(direction) {
        // If we're already scrolling or locked, ignore this scroll event
        if (isScrolling || isScrollLocked) return

        // Calculate target section
        const targetIndex = currentSectionIndex + direction

        // Only proceed if target is valid
        if (targetIndex >= 0 && targetIndex < sections.length) {
          // Lock scrolling immediately to prevent multiple events
          isScrollLocked = true

          // Scroll to the target section
          if (scrollToSection(targetIndex)) {
            // If scroll was successful, lock further scrolling for a period
            setTimeout(() => {
              isScrollLocked = false
            }, scrollLockTime)
          } else {
            // If scroll failed, release lock
            isScrollLocked = false
          }
        }
      }

      // Wheel event handler - completely rewritten
      let lastWheelDirection = 0
      let lastWheelTime = 0
      const wheelThreshold = 10

      window.addEventListener("wheel", (e) => {
        e.preventDefault()

        // Get current time for throttling
        const now = Date.now()

        // If we're in a locked state, completely ignore wheel events
        if (isScrolling || isScrollLocked) return

        // Determine direction with threshold
        if (Math.abs(e.deltaY) > wheelThreshold) {
          const direction = e.deltaY > 0 ? 1 : -1

          // Only process if it's been long enough since last wheel event
          // or if the direction has changed
          if (now - lastWheelTime > 200 || direction !== lastWheelDirection) {
            lastWheelDirection = direction
            lastWheelTime = now
            handleScroll(direction)
          }
        }
      }, { passive: false })

      // Keyboard navigation
      document.addEventListener("keydown", (e) => {
        // If we're in a locked state, ignore keyboard events
        if (isScrolling || isScrollLocked) return

        if (e.key === "ArrowDown" || e.key === "PageDown") {
          e.preventDefault()
          handleScroll(1)
        } else if (e.key === "ArrowUp" || e.key === "PageUp") {
          e.preventDefault()
          handleScroll(-1)
        }
      })

      // Touch navigation - improved
      let touchStartY = 0
      let touchStartTime = 0
      const TOUCH_THRESHOLD = 50

      document.addEventListener("touchstart", (e) => {
        touchStartY = e.touches[0].clientY
        touchStartTime = Date.now()
      }, { passive: false })

      document.addEventListener("touchmove", (e) => {
        // Prevent default to disable native scrolling
        e.preventDefault()
      }, { passive: false })

      document.addEventListener("touchend", (e) => {
        // If we're in a locked state, ignore touch events
        if (isScrolling || isScrollLocked) return

        const touchEndY = e.changedTouches[0].clientY
        const touchDiff = touchStartY - touchEndY
        const touchDuration = Date.now() - touchStartTime

        // Only process if touch was fast enough and long enough
        if (Math.abs(touchDiff) > TOUCH_THRESHOLD && touchDuration < 300) {
          const direction = touchDiff > 0 ? 1 : -1
          handleScroll(direction)
        }
      }, { passive: false })

      // Navigation dot clicks
      dots.forEach((dot) => {
        dot.addEventListener("click", function () {
          // If we're in a locked state, ignore clicks
          if (isScrolling || isScrollLocked) return

          const targetIndex = parseInt(this.getAttribute("data-target"), 10)

          // Only move one section at a time for sequential navigation
          if (targetIndex !== currentSectionIndex) {
            const direction = targetIndex > currentSectionIndex ? 1 : -1
            handleScroll(direction)
          }
        })
      })

      // Nav link clicks
      navLinks.forEach((link, index) => {
        if (index > 0 && index <= 3) {
          link.addEventListener("click", (e) => {
            e.preventDefault()

            // If we're in a locked state, ignore clicks
            if (isScrolling || isScrollLocked) return

            const targetSection = index - 1

            // Only move one section at a time for sequential navigation
            if (targetSection !== currentSectionIndex) {
              const direction = targetSection > currentSectionIndex ? 1 : -1
              handleScroll(direction)
            }
          })
        }
      })

      // Initialize
      disableNativeScroll()
      initializeActiveStates()

      // Add CSS to ensure sections take up full viewport
      sections.forEach(section => {
        section.style.height = '100vh'
        section.style.scrollSnapAlign = 'start'
      })

      // Set up container for scroll snapping
      if (sectionContainer) {
        sectionContainer.style.scrollSnapType = 'y mandatory'
        sectionContainer.style.overflowY = 'scroll'
        sectionContainer.style.height = '100vh'
      }
    })
  </script>







  <script>
    // Replace your existing navigation highlighting code with this
    document.addEventListener("DOMContentLoaded", () => {
      // Get all sections and navigation links
      const sections = document.querySelectorAll("section")
      const desktopNavLinks = document.querySelectorAll(".desktop-links a")
      const mobileNavLinks = document.querySelectorAll(".fullscreen-nav a")

      // Mobile menu functionality
      const menuToggle = document.querySelector(".menu-toggle")
      const fullscreenNav = document.querySelector(".fullscreen-nav")
      const closeBtn = document.querySelector(".close-btn")
      const searchDesktop = document.querySelector(".search")

      if (menuToggle && fullscreenNav && closeBtn && searchDesktop) {
        menuToggle.addEventListener("click", () => {
          fullscreenNav.classList.add("active")
          fullscreenNav.style.display = "flex"
          menuToggle.style.visibility = "hidden"
          searchDesktop.style.visibility = "hidden"
        })

        closeBtn.addEventListener("click", () => {
          fullscreenNav.classList.remove("active")
          fullscreenNav.style.display = "none"
          menuToggle.style.visibility = "visible"
          searchDesktop.style.visibility = "visible"
        })
      }

      // Function to set active navigation link
      function setActiveNav(sectionId) {
        // Remove active class from all links
        desktopNavLinks.forEach((link) => link.classList.remove("active"))
        mobileNavLinks.forEach((link) => link.classList.remove("active"))

        // Add active class to links that match the current section
        const currentSectionLinks = document.querySelectorAll(`a[href="#${sectionId}"]`)
        currentSectionLinks.forEach((link) => link.classList.add("active"))
      }

      // Create Intersection Observer to detect active section
      const observerOptions = {
        root: null, // Use viewport as root
        rootMargin: "-40% 0px -40% 0px", // Adjust this to control when the section is considered "active"
        threshold: 0.1, // Trigger when at least 10% of the target is visible
      }

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          // When section enters viewport
          if (entry.isIntersecting) {
            const sectionId = entry.target.getAttribute("id")
            setActiveNav(sectionId)
          }
        })
      }, observerOptions)

      // Observe all sections
      sections.forEach((section) => {
        observer.observe(section)
      })

      // Set initial active section based on current position
      function setInitialActive() {
        // Get current scroll position
        const scrollPosition = window.scrollY + window.innerHeight / 3

        // Find the section that's currently in view
        for (let i = 0; i < sections.length; i++) {
          const section = sections[i]
          const sectionTop = section.offsetTop
          const sectionHeight = section.offsetHeight

          if (scrollPosition >= sectionTop && scrollPosition < sectionTop + sectionHeight) {
            setActiveNav(section.getAttribute("id"))
            break
          }
        }
      }

      // Set initial active section on page load
      setInitialActive()

      // Handle navigation link clicks
      function handleNavClick(e) {
        e.preventDefault()
        const targetId = this.getAttribute("href").substring(1)
        const targetSection = document.getElementById(targetId)

        if (targetSection) {
          targetSection.scrollIntoView({ behavior: "smooth" })
          setActiveNav(targetId)

          // Close mobile menu if open
          if (fullscreenNav && fullscreenNav.classList.contains("active")) {
            fullscreenNav.classList.remove("active")
            fullscreenNav.style.display = "none"
            if (menuToggle) menuToggle.style.visibility = "visible"
            if (searchDesktop) searchDesktop.style.visibility = "visible"
          }
        }
      }

      // Add click event listeners to navigation links
      desktopNavLinks.forEach((link) => {
        link.addEventListener("click", handleNavClick)
      })

      mobileNavLinks.forEach((link) => {
        link.addEventListener("click", handleNavClick)
      })
    })

  </script>


  <script>
    function initModal() {
      const modalButton = document.getElementById("openModal");
      const modal = document.getElementById("formModal");
      const closeModalButton = document.getElementById("closeModal");

      if (!modalButton || !modal || !closeModalButton) return;

      // Open modal on plus icon click
      modalButton.addEventListener("click", () => {
        modal.style.display = "flex"; // Use "flex" for proper centering
      });

      // Close modal on close button click
      closeModalButton.addEventListener("click", () => {
        modal.style.display = "none";
      });

      // Close modal when clicking outside of modal content
      window.addEventListener("click", (event) => {
        if (event.target === modal) {
          modal.style.display = "none";
        }
      });
    }
    initModal();
  </script>
